name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # the gitops repo pins the digest of :main and Renovate bumps it; the sha tag is for rollbacks
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            WHATSAPP_INVITE=https://chat.whatsapp.com/DNJmgUJeM7JLJeywDufKbW
            DISCORD_INVITE=https://discord.gg/MqbUwBNuna
          tags: |
            ghcr.io/fachschaft-informatik-nordakademie/onboarding:${{ github.sha }}
            ghcr.io/fachschaft-informatik-nordakademie/onboarding:main
